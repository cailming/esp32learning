<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32-S3-CAM 语音拍照</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            margin: 24px;
            background: #f5f7fa;
            color: #1f2937;
        }
        .card {
            max-width: 720px;
            margin: auto;
            padding: 22px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 14px #0002;
        }
        h2 { margin-top: 0; }
        .hint {
            color: #5b6472;
            line-height: 1.7;
        }
        .status {
            margin: 18px 0 12px;
            padding: 12px 14px;
            background: #f0f4f8;
            border-radius: 10px;
            font-weight: 600;
        }
        img {
            width: 100%;
            height: auto;
            display: none;
            margin-top: 14px;
            background: #e5e7eb;
            border-radius: 12px;
        }
        code {
            padding: 2px 6px;
            background: #eef2f7;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>ESP32-S3-CAM 语音拍照</h2>

    <div class="hint">
        先说 <b>“你好小智”</b>，再说 <b>“拍照”</b>。<br>
        拍照成功后，页面会自动刷新为最新照片。<br>
        直接 JPEG 地址：<code>/photo.jpg</code>
    </div>

    <div id="status" class="status">等待第一次语音拍照...</div>
    <img id="photo" alt="最新语音拍摄照片">
</div>

<script>
    let lastSequence = 0;

    async function pollStatus() {
        const statusElement = document.getElementById('status');
        const image = document.getElementById('photo');

        try {
            const response = await fetch(`/status?ts=${Date.now()}`, {
                cache: 'no-store'
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const status = await response.json();

            if (!status.has_photo) {
                statusElement.textContent = '等待第一次语音拍照...';
                return;
            }

            statusElement.textContent =
                `最新照片 #${status.sequence} · ${status.width}×${status.height} · ${status.bytes} bytes`;

            if (status.sequence !== lastSequence) {
                lastSequence = status.sequence;
                image.src = `/photo.jpg?n=${status.sequence}&ts=${Date.now()}`;
                image.style.display = 'block';
            }
        } catch (error) {
            statusElement.textContent = '与 ESP32-S3 通信失败，请确认仍连接 S3CAM-Photo';
        }
    }

    setInterval(pollStatus, 500);
    pollStatus();
</script>
</body>
</html>
