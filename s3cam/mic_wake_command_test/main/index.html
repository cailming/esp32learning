<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32-S3-CAM 语音拍照</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            margin: 24px;
            background: #f5f7fa;
            color: #1f2937;
        }
        .card {
            max-width: 720px;
            margin: auto;
            padding: 22px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 14px #0002;
        }
        h2 { margin-top: 0; }
        .hint {
            color: #5b6472;
            line-height: 1.7;
        }
        .status {
            margin: 18px 0 12px;
            padding: 12px 14px;
            background: #f0f4f8;
            border-radius: 10px;
            font-weight: 600;
        }
        img {
            width: 100%;
            height: auto;
            display: none;
            margin-top: 14px;
            background: #e5e7eb;
            border-radius: 12px;
        }
        code {
            padding: 2px 6px;
            background: #eef2f7;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>ESP32-S3-CAM 语音拍照</h2>

    <div class="hint">
        先说 <b>“你好小智”</b>，再说 <b>“拍照”</b>。<br>
        拍照成功后，页面会自动刷新为最新照片。<br>
        直接 JPEG 地址：<code>/photo.jpg</code>
    </div>

    <div id="status" class="status">等待第一次语音拍照...</div>
    <img id="photo" alt="最新语音拍摄照片">
</div>

<script>
    /*
     * displayedSequence：浏览器已经真正显示成功的照片序号。
     * pendingSequence  ：当前正在下载/解码的照片序号。
     * latestSequence   ：/status 最近一次返回的最新照片序号。
     *
     * 旧版代码在 image.src 真正加载成功前就更新 lastSequence。
     * 一旦某次 /photo.jpg 请求失败，后续轮询会误以为该序号已经显示过，
     * 只能等下一次拍照 sequence 改变才再次请求，于是用户会感觉需要拍两三次。
     *
     * 当前实现只有 JPEG 完整 fetch 成功并完成浏览器解码后，才更新
     * displayedSequence；失败则保持 displayedSequence 不变，下一轮 500ms
     * 轮询自动重试同一张照片。
     */
    let displayedSequence = 0;
    let pendingSequence = 0;
    let latestSequence = 0;
    let currentObjectUrl = null;

    const statusElement = document.getElementById('status');
    const imageElement = document.getElementById('photo');

    async function loadPhoto(sequence) {
        if (sequence <= 0 || sequence === displayedSequence || sequence === pendingSequence) {
            return;
        }

        pendingSequence = sequence;

        try {
            /*
             * 直接 fetch JPEG 为 Blob，只发生一次 HTTP 请求。
             * 不再先 new Image() 预加载、再把同一 no-store URL 赋给页面 img，
             * 避免浏览器因为 Cache-Control: no-store 再发第二次请求。
             */
            const response = await fetch(`/photo.jpg?n=${sequence}&ts=${Date.now()}`, {
                cache: 'no-store'
            });

            if (!response.ok) {
                throw new Error(`photo HTTP ${response.status}`);
            }

            const blob = await response.blob();
            if (!blob || blob.size === 0) {
                throw new Error('empty photo blob');
            }

            /*
             * 如果下载过程中又拍了更新的照片，旧请求不要覆盖新照片。
             * 清掉 pending 后，下一轮 /status 会继续拉取最新 sequence。
             */
            if (sequence !== latestSequence) {
                if (pendingSequence === sequence) {
                    pendingSequence = 0;
                }
                return;
            }

            const newObjectUrl = URL.createObjectURL(blob);
            const oldObjectUrl = currentObjectUrl;

            imageElement.onload = () => {
                if (oldObjectUrl) {
                    URL.revokeObjectURL(oldObjectUrl);
                }

                currentObjectUrl = newObjectUrl;
                displayedSequence = sequence;

                if (pendingSequence === sequence) {
                    pendingSequence = 0;
                }

                imageElement.style.display = 'block';
                statusElement.textContent = `照片 #${sequence} 已显示`;
            };

            imageElement.onerror = () => {
                URL.revokeObjectURL(newObjectUrl);

                if (pendingSequence === sequence) {
                    pendingSequence = 0;
                }

                if (sequence === latestSequence) {
                    statusElement.textContent = `照片 #${sequence} 解码失败，正在自动重试...`;
                }
            };

            imageElement.src = newObjectUrl;
        } catch (error) {
            if (pendingSequence === sequence) {
                pendingSequence = 0;
            }

            if (sequence === latestSequence) {
                statusElement.textContent = `照片 #${sequence} 加载失败，正在自动重试...`;
            }
        }
    }

    async function pollStatus() {
        try {
            const response = await fetch(`/status?ts=${Date.now()}`, {
                cache: 'no-store'
            });

            if (!response.ok) {
                throw new Error(`status HTTP ${response.status}`);
            }

            const status = await response.json();

            if (!status.has_photo) {
                latestSequence = 0;
                statusElement.textContent = '等待第一次语音拍照...';
                return;
            }

            latestSequence = status.sequence;

            if (displayedSequence === latestSequence) {
                statusElement.textContent =
                    `最新照片 #${status.sequence} · ${status.width}×${status.height} · ${status.bytes} bytes`;
                return;
            }

            statusElement.textContent =
                `检测到新照片 #${status.sequence} · ${status.width}×${status.height} · ${status.bytes} bytes，正在加载...`;

            loadPhoto(latestSequence);
        } catch (error) {
            statusElement.textContent = '与 ESP32-S3 通信失败，请确认仍连接 S3CAM-Photo';
        }
    }

    setInterval(pollStatus, 500);
    pollStatus();
</script>
</body>
</html>
