<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32-S3-CAM 语音拍照</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            margin: 24px;
            background: #f5f7fa;
            color: #1f2937;
        }
        .card {
            max-width: 720px;
            margin: auto;
            padding: 22px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 14px #0002;
        }
        h2 { margin-top: 0; }
        .hint {
            color: #5b6472;
            line-height: 1.7;
        }
        .status {
            margin: 18px 0 12px;
            padding: 12px 14px;
            background: #f0f4f8;
            border-radius: 10px;
            font-weight: 600;
        }
        img {
            width: 100%;
            height: auto;
            display: none;
            margin-top: 14px;
            background: #e5e7eb;
            border-radius: 12px;
        }
        code {
            padding: 2px 6px;
            background: #eef2f7;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>ESP32-S3-CAM 语音拍照</h2>

    <div class="hint">
        先说 <b>“你好小智”</b>，再说 <b>“拍照”</b>。<br>
        拍照成功后，页面会自动刷新为最新照片。<br>
        直接 JPEG 地址：<code>/photo.jpg</code>
    </div>

    <div id="status" class="status">等待第一次语音拍照...</div>
    <img id="photo" alt="最新语音拍摄照片">
</div>

<script>
    /*
     * displayedSequence：浏览器已经真正加载成功并显示出来的照片序号。
     * pendingSequence  ：当前正在下载的照片序号。
     * latestSequence   ：/status 最近一次告诉我们的最新照片序号。
     *
     * 旧版代码在设置 image.src 之前就先更新 lastSequence；如果那一次图片
     * 请求失败，页面会误以为已经显示过，从而一直等到下一次拍照才重试。
     * 现在只有图片 onload 成功以后才更新 displayedSequence；请求失败时
     * pendingSequence 会清零，下一轮 /status 轮询会自动重试同一张照片。
     */
    let displayedSequence = 0;
    let pendingSequence = 0;
    let latestSequence = 0;

    const statusElement = document.getElementById('status');
    const imageElement = document.getElementById('photo');

    function loadPhoto(sequence) {
        if (sequence <= 0 || sequence === displayedSequence || sequence === pendingSequence) {
            return;
        }

        pendingSequence = sequence;

        /*
         * 先用独立 Image 对象预加载。
         * 只有 JPEG 完整下载成功，才替换页面上当前正在显示的照片，
         * 避免一次失败请求把原本正常的旧照片也弄成破图。
         */
        const loader = new Image();
        const url = `/photo.jpg?n=${sequence}&ts=${Date.now()}`;

        loader.onload = () => {
            /*
             * 如果加载期间又拍了更新的照片，只允许当前最新序号覆盖页面。
             * 较旧请求即使晚到，也不会把新照片覆盖回旧照片。
             */
            if (sequence === latestSequence) {
                imageElement.src = url;
                imageElement.style.display = 'block';
                displayedSequence = sequence;
                statusElement.textContent = `照片 #${sequence} 已显示`;
            }

            if (pendingSequence === sequence) {
                pendingSequence = 0;
            }
        };

        loader.onerror = () => {
            /* 不更新 displayedSequence，让下一次 500ms 轮询自动重试。 */
            if (pendingSequence === sequence) {
                pendingSequence = 0;
            }

            if (sequence === latestSequence) {
                statusElement.textContent = `照片 #${sequence} 加载失败，正在自动重试...`;
            }
        };

        loader.src = url;
    }

    async function pollStatus() {
        try {
            const response = await fetch(`/status?ts=${Date.now()}`, {
                cache: 'no-store'
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const status = await response.json();

            if (!status.has_photo) {
                latestSequence = 0;
                statusElement.textContent = '等待第一次语音拍照...';
                return;
            }

            latestSequence = status.sequence;

            if (displayedSequence === latestSequence) {
                statusElement.textContent =
                    `最新照片 #${status.sequence} · ${status.width}×${status.height} · ${status.bytes} bytes`;
                return;
            }

            statusElement.textContent =
                `检测到新照片 #${status.sequence} · ${status.width}×${status.height} · ${status.bytes} bytes，正在加载...`;

            loadPhoto(latestSequence);
        } catch (error) {
            statusElement.textContent = '与 ESP32-S3 通信失败，请确认仍连接 S3CAM-Photo';
        }
    }

    setInterval(pollStatus, 500);
    pollStatus();
</script>
</body>
</html>
